            min-height: 100vh;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.4s ease-out;

        .card-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);

        .card-shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // STARTER FOOD DATABASE - Edit this to change default foods for all users
        const STARTER_FOODS = [
            // FRESH LIST - Adding ingredients.
            { name: "Boiled potatoes (100 g)", calories: 87, protein: 1.9, fat: 0.1, carb: 20.1, dietryFiber: 1.8, saturatedFat: 0.03 },
            { name: "1 tortilla (soft taco)", calories: 60, protein: 5, fat: 3.5, carb: 20, dietryFiber: 18, saturatedFat: 1.5 },

            { name: "1 roti - phulka fresh", calories: 100, protein: 3, fat: 2.5, carb: 15, dietryFiber: 1, saturatedFat: 0 },
            { name: "Rajma (100g)", calories: 127, protein: 8.67, fat: 0.5, carb: 22.8, dietryFiber: 7.4, saturatedFat: 0.5 },
            { name: "Chole (100g)", calories: 164, protein: 15, fat: 2.6, carb: 27, dietryFiber: 7.6, saturatedFat: 2.6 },
            { name: "Fat free milk (240 ml)", calories: 90, protein: 8, fat: 0, carb: 13, dietryFiber: 0, saturatedFat: 0 },
            { name: "Coffee (not counting cals right now)", calories: 0, protein: 0, fat: 0, carb: 0, dietryFiber: 0, saturatedFat: 0 },
            { name: "Sugar (1 tsp - 4g)", calories: 16, protein: 0, fat: 0, carb: 4, dietryFiber: 0, saturatedFat: 0 },
            { name: "Ketchup (1 tbsp - 17g)", calories: 20, protein: 0, fat: 0, carb: 5, dietryFiber: 0, saturatedFat: 0 }
        ];

        // Icons as inline SVG components
        const Plus = ({ size = 24 }) => (

        const Trash2 = ({ size = 20 }) => (

        const Edit2 = ({ size = 18 }) => (

        const Check = ({ size = 20 }) => (

            </svg>
        );

        const X = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        );

        const RefreshCw = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
        );

        const Database = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
        );

        const TrendingUp = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );

        const History = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 3v5h5"></path>
                <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
                <path d="M12 7v5l4 2"></path>
            </svg>
        );

        const Download = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
        );

        const Target = () => (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
            </svg>
        );

        // Computes the macro contribution of a single recipe ingredient, scaled from
        // the ingredient food's macros (defined per its servingSize, default 100g)
        // to the grams actually used.
        const getIngredientContribution = (ingredient, foodDatabase) => {
            const empty = { calories: 0, protein: 0, fat: 0, carb: 0, dietryFiber: 0, saturatedFat: 0 };
            const food = foodDatabase.find(f => f.id === ingredient.foodId);
            if (!food) return empty;
            const baseSize = food.servingSize || 100;
            const ratio = (parseFloat(ingredient.grams) || 0) / baseSize;
            return {
                calories: food.calories * ratio,
                protein: food.protein * ratio,
                fat: food.fat * ratio,
                carb: food.carb * ratio,
                dietryFiber: food.dietryFiber * ratio,
                saturatedFat: food.saturatedFat * ratio
            };
        };

        // Local calendar-day key (not UTC), used to key sessions by day: "2026-09-15"
        const getDateKey = (d = new Date()) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const formatDateKey = (dateKey) => {
            const d = new Date(`${dateKey}T00:00:00`);
            return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        };

        const sumIngredientMacros = (ingredients, foodDatabase) => {
            const totals = { calories: 0, protein: 0, fat: 0, carb: 0, dietryFiber: 0, saturatedFat: 0 };
            (ingredients || []).forEach(ing => {
                const c = getIngredientContribution(ing, foodDatabase);
                totals.calories += c.calories;
                totals.protein += c.protein;
                totals.fat += c.fat;
                totals.carb += c.carb;
                totals.dietryFiber += c.dietryFiber;
                totals.saturatedFat += c.saturatedFat;
            });
            return totals;
        };

        function MacroTracker() {
            const [foodDatabase, setFoodDatabase] = useState([]);
            const [allSessions, setAllSessions] = useState([]);
            const [currentSessionId, setCurrentSessionId] = useState(null);
            const [dietPlans, setDietPlans] = useState([]);
            const [activePlanId, setActivePlanId] = useState(null);
            const [showAddPlan, setShowAddPlan] = useState(false);
            const [newPlanName, setNewPlanName] = useState('');
            const [planItemDrafts, setPlanItemDrafts] = useState({});
            const [showAddFood, setShowAddFood] = useState(false);
            const [showAddEntry, setShowAddEntry] = useState(false);
            const [editingFood, setEditingFood] = useState(null);
            const [view, setView] = useState('tracker');
            const [loading, setLoading] = useState(true);
            const todayKeyRef = useRef(getDateKey());

            const [newFood, setNewFood] = useState({
                name: '',
                calories: '',
                protein: '',
                fat: '',
                carb: '',
                dietryFiber: '',
                saturatedFat: '',
                servingSize: '100'
            });

            const [foodMode, setFoodMode] = useState('simple'); // 'simple' | 'recipe'
            const [newRecipe, setNewRecipe] = useState({ name: '', ingredients: [] });

            const [newEntry, setNewEntry] = useState({
                foodId: '',
                count: 1
            });

            useEffect(() => {
                loadData();
            }, []);

            // Checks once a minute whether the calendar day has rolled over while the
            // app stayed open, so a session for the new day gets created automatically
            // and the view follows it (unless the user had switched to some other day).
            useEffect(() => {
                const interval = setInterval(() => {
                    const newTodayKey = getDateKey();
                    if (newTodayKey === todayKeyRef.current) return;
                    const previousTodayKey = todayKeyRef.current;
                    todayKeyRef.current = newTodayKey;

                    setAllSessions(prev => {
                        if (prev.some(s => s.id === newTodayKey)) return prev;
                        const updated = [{ id: newTodayKey, date: newTodayKey, log: [] }, ...prev];
                        saveSessions(updated);
                        return updated;
                    });
                    setCurrentSessionId(prevId => prevId === previousTodayKey ? newTodayKey : prevId);
                }, 60000);
                return () => clearInterval(interval);
            }, []);

            // Merges legacy name/timestamp sessions into date-keyed ones (same-day logs
            // combined) and makes sure today's session exists.
            const normalizeSessions = (sessions) => {
                const byDateKey = {};
                sessions.forEach(s => {
                    const key = /^\d{4}-\d{2}-\d{2}$/.test(s.date || '') ? s.date : getDateKey(new Date(s.date || Date.now()));
                    if (byDateKey[key]) {
                        byDateKey[key].log = [...byDateKey[key].log, ...(s.log || [])];
                    } else {
                        byDateKey[key] = { id: key, date: key, log: s.log || [] };
                    }
                });

                const todayKey = getDateKey();
                if (!byDateKey[todayKey]) {
                    byDateKey[todayKey] = { id: todayKey, date: todayKey, log: [] };
                }

                const sorted = Object.values(byDateKey).sort((a, b) => b.date.localeCompare(a.date));
                return { sessions: sorted, todayKey };
            };

            const loadData = () => {
                setLoading(true);
                try {
                    const dbData = localStorage.getItem('food-database');
                    if (dbData) {
                        setFoodDatabase(JSON.parse(dbData));
                    } else {
                        // First time user - load starter foods
                        const starterFoods = STARTER_FOODS.map((food, index) => ({
                            ...food,
                            id: `starter-${Date.now()}-${index}`
                        }));
                        setFoodDatabase(starterFoods);
                        saveDatabase(starterFoods);
                    }

                    const sessionsData = localStorage.getItem('tracking-sessions');
                    const rawSessions = sessionsData ? JSON.parse(sessionsData) : [];
                    const { sessions, todayKey } = normalizeSessions(rawSessions);
                    setAllSessions(sessions);
                    saveSessions(sessions);
                    setCurrentSessionId(todayKey);
                    todayKeyRef.current = todayKey;

                    const plansData = localStorage.getItem('diet-plans');
                    if (plansData) {
                        setDietPlans(JSON.parse(plansData));
                    }

                    const activePlanData = localStorage.getItem('active-plan-id');
                    if (activePlanData) {
                        setActivePlanId(activePlanData);
                    }
                } catch (error) {
                    console.log('No existing data, starting fresh');
                    const starterFoods = STARTER_FOODS.map((food, index) => ({
                        ...food,
                        id: `starter-${Date.now()}-${index}`
                    }));
                    setFoodDatabase(starterFoods);
                    saveDatabase(starterFoods);

                    const todayKey = getDateKey();
                    const freshSession = { id: todayKey, date: todayKey, log: [] };
                    setAllSessions([freshSession]);
                    saveSessions([freshSession]);
                    setCurrentSessionId(todayKey);
                    todayKeyRef.current = todayKey;
                }
                setLoading(false);
            };

            const saveSessions = (sessions) => {
                try {
                    localStorage.setItem('tracking-sessions', JSON.stringify(sessions));
                } catch (error) {
                    console.error('Error saving sessions:', error);
                }
            };

            const saveDatabase = (db) => {
                try {
                    localStorage.setItem('food-database', JSON.stringify(db));
                } catch (error) {
                    console.error('Error saving database:', error);
                }
            };

            const handleResetToDefaults = () => {
                if (!window.confirm('This will permanently delete your food database and tracking sessions, then reload the app with default data. Continue?')) {
                    return;
                }
                localStorage.removeItem('food-database');
                localStorage.removeItem('tracking-sessions');
                localStorage.removeItem('diet-plans');
                localStorage.removeItem('active-plan-id');
                window.location.reload();
            };

            const handleReloadDefaultMacros = () => {
                if (!window.confirm('This will overwrite the macro values (calories, protein, fat, carb, fiber, saturated fat) of any food matching a name in the default food list, using the latest values. Custom foods and logged history will not be touched. Continue?')) {
                    return;
                }
                const existingByName = new Map(foodDatabase.map(f => [f.name, f]));
                let updatedCount = 0;
                const updatedDb = foodDatabase.map(food => {
                    const starter = STARTER_FOODS.find(s => s.name === food.name);
                    if (!starter) return food;
                    updatedCount++;
                    return {
                        ...food,
                        calories: starter.calories,
                        protein: starter.protein,
                        fat: starter.fat,
                        carb: starter.carb,
                        dietryFiber: starter.dietryFiber,
                        saturatedFat: starter.saturatedFat
                    };
                });
                const newStarters = STARTER_FOODS
                    .filter(s => !existingByName.has(s.name))
                    .map((food, index) => ({ ...food, id: `starter-${Date.now()}-${index}` }));
                const finalDb = [...updatedDb, ...newStarters];
                setFoodDatabase(finalDb);
                saveDatabase(finalDb);
                alert(`Updated ${updatedCount} default food(s)${newStarters.length ? `, added ${newStarters.length} new default food(s)` : ''}.`);
            };

            const savePlans = (plans) => {
                try {
                    localStorage.setItem('diet-plans', JSON.stringify(plans));
                } catch (error) {
                    console.error('Error saving plans:', error);
                }
            };

            const saveActivePlanId = (id) => {
                if (id) {
                    localStorage.setItem('active-plan-id', id);
                } else {
                    localStorage.removeItem('active-plan-id');
                }
            };

            const getCurrentSession = () => {
                return allSessions.find(s => s.id === currentSessionId);
            };

            const updateCurrentSession = (updatedLog) => {
                const updatedSessions = allSessions.map(s => 
                    s.id === currentSessionId ? { ...s, log: updatedLog } : s
                );
                setAllSessions(updatedSessions);
                saveSessions(updatedSessions);
            };

            const deleteSession = (sessionId) => {
                const updatedSessions = allSessions.filter(s => s.id !== sessionId);
                setAllSessions(updatedSessions);
                saveSessions(updatedSessions);
                
                if (sessionId === currentSessionId && updatedSessions.length > 0) {
                    setCurrentSessionId(updatedSessions[0].id);
                }
            };

            const exportData = () => {
                const data = {
                    foodDatabase,
                    sessions: allSessions,
                    dietPlans,
                    activePlanId
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `macro-tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const exportFoodDatabase = () => {
                const data = {
                    foodDatabase: foodDatabase,
                    libraryName: "My Food Library",
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `food-library-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const importData = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.foodDatabase) {
                                setFoodDatabase(data.foodDatabase);
                                saveDatabase(data.foodDatabase);
                            }
                            if (data.sessions) {
                                setAllSessions(data.sessions);
                                saveSessions(data.sessions);
                                if (data.sessions.length > 0) {
                                    setCurrentSessionId(data.sessions[0].id);
                                }
                            }
                            if (data.dietPlans) {
                                setDietPlans(data.dietPlans);
                                savePlans(data.dietPlans);
                            }
                            if (data.activePlanId !== undefined) {
                                setActivePlanId(data.activePlanId);
                                saveActivePlanId(data.activePlanId);
                            }
                            alert('Data imported successfully!');
                        } catch (error) {
                            alert('Error importing data. Please check the file.');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const importFoodLibrary = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const data = JSON.parse(event.target.result);
                            if (data.foodDatabase && Array.isArray(data.foodDatabase)) {
                                // Add imported foods to existing database (avoid duplicates by name)
                                const existingNames = new Set(foodDatabase.map(f => f.name.toLowerCase()));
                                const newFoods = data.foodDatabase
                                    .filter(f => !existingNames.has(f.name.toLowerCase()))
                                    .map(food => ({
                                        ...food,
                                        id: `imported-${Date.now()}-${Math.random()}`
                                    }));
                                
                                const updatedDb = [...foodDatabase, ...newFoods];
                                setFoodDatabase(updatedDb);
                                saveDatabase(updatedDb);
                                alert(`Imported ${newFoods.length} new foods! (Duplicates skipped)`);
                            } else {
                                alert('Invalid food library format.');
                            }
                        } catch (error) {
                            alert('Error importing food library. Please check the file.');
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            };

            const addFood = () => {
                if (!newFood.name || !newFood.calories) return;

                const food = {
                    id: Date.now().toString(),
                    name: newFood.name,
                    calories: parseFloat(newFood.calories) || 0,
                    protein: parseFloat(newFood.protein) || 0,
                    fat: parseFloat(newFood.fat) || 0,
                    carb: parseFloat(newFood.carb) || 0,
                    dietryFiber: parseFloat(newFood.dietryFiber) || 0,
                    saturatedFat: parseFloat(newFood.saturatedFat) || 0,
                    servingSize: parseFloat(newFood.servingSize) || 100
                };

                const updatedDb = [...foodDatabase, food];
                setFoodDatabase(updatedDb);
                saveDatabase(updatedDb);

                setNewFood({
                    name: '',
                    calories: '',
                    protein: '',
                    fat: '',
                    carb: '',
                    dietryFiber: '',
                    saturatedFat: '',
                    servingSize: '100'
                });
                setShowAddFood(false);
            };

            const addRecipeIngredientRow = () => {
                setNewRecipe(prev => ({
                    ...prev,
                    ingredients: [...prev.ingredients, { id: `ing-${Date.now()}-${Math.random()}`, foodId: '', grams: '' }]
                }));
            };

            const updateRecipeIngredient = (id, field, value) => {
                setNewRecipe(prev => ({
                    ...prev,
                    ingredients: prev.ingredients.map(ing => ing.id === id ? { ...ing, [field]: value } : ing)
                }));
            };

            const removeRecipeIngredient = (id) => {
                setNewRecipe(prev => ({
                    ...prev,
                    ingredients: prev.ingredients.filter(ing => ing.id !== id)
                }));
            };

            const saveRecipe = () => {
                if (!newRecipe.name) return;
                const validIngredients = newRecipe.ingredients.filter(ing => ing.foodId && parseFloat(ing.grams) > 0);
                if (validIngredients.length === 0) return;

                const macros = sumIngredientMacros(validIngredients, foodDatabase);
                const totalGrams = validIngredients.reduce((sum, ing) => sum + (parseFloat(ing.grams) || 0), 0);

                const recipeFood = {
                    id: Date.now().toString(),
                    name: newRecipe.name,
                    calories: macros.calories,
                    protein: macros.protein,
                    fat: macros.fat,
                    carb: macros.carb,
                    dietryFiber: macros.dietryFiber,
                    saturatedFat: macros.saturatedFat,
                    isComposite: true,
                    servingSize: totalGrams,
                    ingredients: validIngredients.map(ing => ({ id: ing.id, foodId: ing.foodId, grams: parseFloat(ing.grams) || 0 }))
                };

                const updatedDb = [...foodDatabase, recipeFood];
                setFoodDatabase(updatedDb);
                saveDatabase(updatedDb);

                setNewRecipe({ name: '', ingredients: [] });
                setShowAddFood(false);
                setFoodMode('simple');
            };

            const startEditFood = (food) => {
                if (food.isComposite) {
                    setEditingFood({
                        ...food,
                        ingredients: (food.ingredients || []).map((ing, idx) => ({
                            id: ing.id || `ing-${idx}`,
                            foodId: ing.foodId,
                            grams: ing.grams.toString()
                        }))
                    });
                } else {
                    setEditingFood(food);
                }
            };

            const addEditIngredientRow = () => {
                setEditingFood(prev => ({
                    ...prev,

                                                                        <button
                                                                            onClick={() => removePlanItem(plan.id, item.id)}
                                                                            className="text-red-600 hover:bg-red-50 p-2 rounded-lg transition-colors"
                                                                        >
                                                                            <Trash2 size={16} />
                                                                        </button>
                                                                    </div>
                                                                );
                                                            })
                                                        )}
                                                    </div>

                                                    <div className="flex gap-2">
                                                        <select
                                                            value={draft.foodId}
                                                            onChange={(e) => updatePlanItemDraft(plan.id, 'foodId', e.target.value)}
                                                            className="flex-1 p-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none text-sm"
                                                        >
                                                            <option value="">Choose a food...</option>
                                                            {foodDatabase.map(food => (
                                                                <option key={food.id} value={food.id}>{food.isComposite ? '🧩 ' : ''}{food.name}</option>
                                                            ))}
                                                        </select>
                                                        <input
                                                            type="number"
                                                            step="0.1"
                                                            placeholder="Servings"
                                                            value={draft.count}
                                                            onChange={(e) => updatePlanItemDraft(plan.id, 'count', e.target.value)}
                                                            className="w-24 p-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none text-sm"
                                                        />
                                                        <button
                                                            onClick={() => addPlanItem(plan.id)}
                                                            className="bg-gray-900 text-white px-4 rounded-lg hover:bg-gray-800 transition-colors"
                                                        >
                                                            <Plus size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<MacroTracker />, document.getElementById('root'));
    </script>
</body>
</html>
